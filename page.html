<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex-Systems</title>
</head>

<body>
    <!-- Cabeçalho: onde vai ficar a logo -->
    <header>Vertex Systems</header>

    <!-- Contagem de tarefas -->
    <section>
        <div>
            <p></p>
            <p>Total</p>
        </div>
        <div>
            <p></p>
            <p>Pendentes</p>
        </div>
        <div>
            <p></p>
            <p>Atrasadas</p>
        </div>
        <div>
            <p></p>
            <p>Concluidas</p>
        </div>
    </section>
    <!-- Formulario para criar task -->
    <main>
        <form>
            <input type="text" placeholder="Descrição">
            <input type="text" placeholder="Categoria">
            <input type="text" placeholder="Prazo">
            <button type="submit">Adicionar</button>
        </form>
    </main>
    <!-- filtros busca e ordenação -->
    <section>
        <button></button>
        <button></button>
        <button></button>
        <input type="text">
        <select>
            <option value="low">Baixa</option>
            <option value="medium" selected>Média</option>
            <option value="high">Alta</option>
        </select>
    </section>
    <!-- Lista de task -->
    <section>
        tarefas
    </section>
</body>

</html>
