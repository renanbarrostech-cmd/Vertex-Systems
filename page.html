<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vertex-Systems</title>
</head>

<body>
    <!-- Cabeçalho: onde vai ficar a logo -->
    <header id="logo">
        <h1>Vertex Systems</h1>
    </header>

    <!-- Contagem de tarefas -->
    <section id="taskCount">
        <div>
            <p>0</p>
            <p class="score">Total</p>
        </div>
        <div>
            <p>0</p>
            <p class="score">Pendentes</p>
        </div>
        <div>
            <p>0</p>
            <p class="score">Atrasadas</p>
        </div>
        <div>
            <p>0</p>
            <p id="score">Concluidas</p>
        </div>
    </section>
    <!-- Formulario para criar task -->
    <main>
        <h2>Cadastrar nova tarefa</h2>
        <form class="frm">
            <input type="text" placeholder="Descrição">
            <input type="text" placeholder="Categoria">
            <input type="text" placeholder="Prazo">
            <button type="submit">Adicionar</button>
        </form>
    </main>
    <!-- filtros busca e ordenação -->
    <section class="filters">

        <button>Todas</button>
        <button>Pendentes</button>
        <button>Concluídas</button>

        <input type="text" placeholder="Pesquisar tarefa">

        <select>
            <option value="low">Baixa</option>
            <option value="medium" selected>Média</option>
            <option value="high">Alta</option>
        </select>

    </section>

    <!-- Lista de tarefas -->

    <section class="task-list">

    </section>
</body>

</html>
